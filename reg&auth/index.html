<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="frame-1">
    <div class="rectangle-2"></div>
    
    <form class="frame-12" id="registration-form">
      <!-- ФИО -->
      <div class="input-form">
        <div class="label">
          <div class="text">
            <span class="label3">ФИО</span>
          </div>
        </div>
        <div class="input-field">
          <img class="input-icon" src="user0.svg" alt="user">
          <input type="text" class="input-text" placeholder="ФИО пользователя" name="fullname">
        </div>
      </div>

      <!-- Эл.Почта -->
      <div class="input-form">
        <div class="label">
          <div class="text">
            <span class="label3">Эл.Почта</span>
          </div>
        </div>
        <div class="input-field">
          <img class="input-icon" src="user0.svg" alt="email">
          <input type="email" class="input-text" placeholder="user@mail.com" name="email">
        </div>
      </div>

      <!-- Номер телефона -->
      <div class="input-form">
        <div class="label">
          <div class="text">
            <span class="label3">Номер телефона</span>
          </div>
        </div>
        <div class="input-field">
          <img class="input-icon" src="phone0.svg" alt="phone">
          <input type="tel" class="input-text" placeholder="+7(XXX)-XXX-XX-XX" name="phone">
        </div>
      </div>

      <!-- Логин -->
      <div class="input-form">
        <div class="label">
          <div class="text">
            <span class="label3">Логин</span>
          </div>
        </div>
        <div class="input-field">
          <img class="input-icon" src="user0.svg" alt="login">
          <input type="text" class="input-text" placeholder="Логин" name="login">
        </div>
      </div>

      <!-- Пароль -->
      <div class="input-form">
        <div class="label">
          <div class="text">
            <span class="label3">Пароль</span>
          </div>
        </div>
        <div class="input-field">
          <img class="input-icon" src="user0.svg" alt="password">
          <input type="password" class="input-text" placeholder="Пароль" name="password">
        </div>
      </div>

      <!-- Helper ссылка -->
      <div class="helper">
        Уже зарегистрированы? <a href="#" class="helper-link">Авторизуйтесь</a>
      </div>

      <!-- Кнопка -->
      <button type="submit" class="button">
        <span class="button-text">Регистрация</span>
      </button>
    </form>
  </div>
</body>
</html>
